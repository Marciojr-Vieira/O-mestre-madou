[build]
  base = "."
  command = "pnpm build:netlify"
  publish = "apps/web/.next"
  functions = ".netlify-api/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.18.3"
  # Configurações públicas (papel, schema, modos, caminhos) aparecem em migrations,
  # exemplos e no pacote da Function. Não incluir DATABASE_URL, JWT_SECRET ou
  # PAYMENT_WEBHOOK_SECRET: esses continuam protegidos pelo secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "APP_URL,WEB_ORIGIN,DEMO_MODE,DATABASE_MODE,DATABASE_SCHEMA,DATABASE_SSL,DATABASE_CA_FILE,DATABASE_ASSETS_DIR,DATABASE_POOL_MAX,DATABASE_MIGRATE,DATABASE_RUNTIME_ROLE,AWS_LAMBDA_JS_RUNTIME"

[functions.api]
  node_bundler = "none"
  included_files = [".netlify-api/runtime/**", ".netlify-api/db/**", ".netlify-api/certs/**"]

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[headers]]
  for = "/v1/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
